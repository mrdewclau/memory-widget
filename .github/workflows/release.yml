name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        env:
          MEMORY_WIDGET_SIGNING_IDENTITY: '-'
        run: |
          ./build_app.sh
          ./test_mcp.sh
      - name: Package
        env:
          MEMORY_WIDGET_SIGNING_IDENTITY: '-'
        run: ./scripts/package_release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Memory Widget ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
