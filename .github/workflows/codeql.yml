name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build
        env:
          MEMORY_WIDGET_SIGNING_IDENTITY: '-'
          MEMORY_WIDGET_SWIFT_OPTIMIZATION: '-Onone'
        run: ./build_app.sh
      - uses: github/codeql-action/analyze@v4
