name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
      - name: Build
        run: ./scripts/codeql_build.sh
      - uses: github/codeql-action/analyze@v4
