name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '31 7 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Build
        env:
          MEMORY_WIDGET_SIGNING_IDENTITY: '-'
        run: ./build_app.sh
      - uses: github/codeql-action/analyze@v3
